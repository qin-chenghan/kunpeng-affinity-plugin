[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kunpeng-affinity-plugin"
version = "0.1.0.dev0"
description = "Experimental vLLM NUMA affinity plugin for Kunpeng systems"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
kunpeng_affinity = "kunpeng_affinity.vllm_plugin:register"

[project.scripts]
kunpeng-affinity-topology = "kunpeng_affinity.topology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
